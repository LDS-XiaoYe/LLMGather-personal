# LLM Gather — 开发环境（热重载）
# 启动: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f

services:
  db:
    image: mysql:8.0
    container_name: llmgather-db-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-llmgather123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-llmgather}
    volumes:
      - mysql_dev_data:/var/lib/mysql
    ports:
      - "${MYSQL_DEV_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pllmgather123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - llmgather-dev-net

  backend:
    image: node:22-alpine
    container_name: llmgather-backend-dev
    working_dir: /app
    command: sh scripts/docker-dev-entrypoint.sh npm run dev:backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
    env_file:
      - .env.docker
    environment:
      - MYSQL_HOST=db
      - NODE_ENV=development
      - CODE_RUNNER_URL=http://code-runner:8787/run
    depends_on:
      db:
        condition: service_healthy
    networks:
      - llmgather-dev-net

  code-runner:
    image: node:22-alpine
    container_name: llmgather-code-runner-dev
    working_dir: /app
    command: node scripts/code-runner-server.mjs
    volumes:
      - .:/app:ro
    environment:
      - CODE_RUNNER_PORT=8787
      - CODE_RUNNER_TIMEOUT_MS=1000
      - CODE_RUNNER_MAX_CODE_LENGTH=4000
    networks:
      - llmgather-dev-net

  frontend:
    image: node:22-alpine
    container_name: llmgather-frontend-dev
    working_dir: /app
    command: sh scripts/docker-dev-entrypoint.sh npm run dev:frontend
    ports:
      - "${FRONTEND_DEV_PORT:-5174}:5173"
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
    environment:
      - VITE_API_TARGET=http://backend:3000
      - VITE_PORT=5173
    depends_on:
      - backend
    networks:
      - llmgather-dev-net

networks:
  llmgather-dev-net:
    driver: bridge

volumes:
  mysql_dev_data:
  node_modules_dev:

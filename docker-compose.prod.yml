# LLM Gather — 生产环境一键部署
# 初始化并启动: npm run deploy
# 停止: docker compose -f docker-compose.prod.yml down
# 查看日志: docker compose -f docker-compose.prod.yml logs -f

services:
  db:
    image: mysql:8.0
    container_name: llmgather-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-llmgather123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-llmgather}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmgather-net

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_ARBITRARY: "0"
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - llmgather-net

  redis:
    image: redis:7-alpine
    container_name: llmgather-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmgather-net

  qdrant:
    image: qdrant/qdrant:v1.15.5@sha256:0fb8897412abc81d1c0430a899b9a81eb8328aa634e7242d1bc804c1fe8fe863
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run deployment initialization to generate QDRANT_API_KEY in .env}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r line <&3; [[ \"$$line\" == *200* ]]"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - llmgather-net

  # Default CPU deployment node; credentials are generated once in a private volume.
  model-agent:
    build:
      context: .
      dockerfile: deployment-agent/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_DATA_DIR: /state
      AGENT_BOOTSTRAP_DIR: /bootstrap
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "19090"
      AGENT_CACHE_VOLUME: llmgather_model_cache
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - model_agent_state:/state
      - model_agent_bootstrap:/bootstrap
      - model_cache:/state/cache
    healthcheck:
      test: ["CMD", "node", "healthcheck.cjs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - model-agent-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llmgather-backend
    restart: unless-stopped
    volumes:
      - model_agent_bootstrap:/run/llmgather-model-agent:ro
    env_file:
      - ${LLMGATHER_ENV_FILE:-.env}
    depends_on:
      model-agent:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MODEL_AGENT_BOOTSTRAP_FILE=/run/llmgather-model-agent/agent.json
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?Run deployment initialization to generate QDRANT_API_KEY in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||3000)+'/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - model-agent-net
      - llmgather-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: llmgather-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - llmgather-net

volumes:
  model_agent_state:
  model_agent_bootstrap:
  model_cache:
    name: llmgather_model_cache
  qdrant_data:
  mysql_data:
  redis_data:

networks:
  model-agent-net:
    driver: bridge
  llmgather-net:
    driver: bridge

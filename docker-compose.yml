# LLM Gather — 开发环境（热重载）
# 启动: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f

services:
  db:
    image: mysql:8.0
    container_name: llmgather-db-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-llmgather123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-llmgather}
    volumes:
      - mysql_dev_data:/var/lib/mysql
    ports:
      - "${MYSQL_DEV_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pllmgather123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - llmgather-dev-net

  redis:
    image: redis:7-alpine
    container_name: llmgather-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "${REDIS_DEV_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - llmgather-dev-net

  langgraph-memory:
    image: node:22-alpine
    container_name: llmgather-langgraph-memory-dev
    working_dir: /app/langgraph
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./langgraph:/app/langgraph
      - langgraph_node_modules_dev:/app/langgraph/node_modules
    environment:
      - LANGGRAPH_ALLOW_BLOCKING=true
    ports:
      - "${LANGGRAPH_MEMORY_DEV_PORT:-2024}:2024"
    networks:
      - llmgather-dev-net

  backend:
    image: node:22-alpine
    container_name: llmgather-backend-dev
    working_dir: /app
    command: sh scripts/docker-dev-entrypoint.sh npm run dev:backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
    env_file:
      - .env.docker
    environment:
      - MYSQL_HOST=db
      - NODE_ENV=development
      - CODE_RUNNER_URL=http://code-runner:8787/run
      - REDIS_URL=redis://redis:6379
      - MEMORY_PROVIDER=langgraph
      - LANGGRAPH_MEMORY_URL=http://langgraph-memory:2024
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      langgraph-memory:
        condition: service_started
    networks:
      - llmgather-dev-net

  code-runner:
    image: node:22-alpine
    container_name: llmgather-code-runner-dev
    working_dir: /app
    command: sh -c "apk add --no-cache python3 py3-pip && node scripts/code-runner-server.mjs"
    volumes:
      - .:/app:ro
    environment:
      - CODE_RUNNER_PORT=8787
      - CODE_RUNNER_TIMEOUT_MS=5000
      - CODE_RUNNER_MAX_CODE_LENGTH=10000
    networks:
      - llmgather-dev-net

  frontend:
    image: node:22-alpine
    container_name: llmgather-frontend-dev
    working_dir: /app
    command: sh scripts/docker-dev-entrypoint.sh npm run dev:frontend
    ports:
      - "${FRONTEND_DEV_PORT:-5174}:5173"
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
    environment:
      - VITE_API_TARGET=http://backend:3000
      - VITE_PORT=5173
    depends_on:
      - backend
    networks:
      - llmgather-dev-net

networks:
  llmgather-dev-net:
    driver: bridge

volumes:
  mysql_dev_data:
  redis_dev_data:
  langgraph_node_modules_dev:
  node_modules_dev:

# LLM Gather — 生产环境一键部署
# 启动: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f

services:
  db:
    image: mysql:8.0
    container_name: llmgather-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-llmgather123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-llmgather}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmgather-net

  redis:
    image: redis:7-alpine
    container_name: llmgather-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmgather-net

  langgraph-memory:
    image: node:22-alpine
    container_name: llmgather-langgraph-memory
    restart: unless-stopped
    working_dir: /app/langgraph
    command: sh -c "npm install --omit=dev && npx langgraphjs dev --host 0.0.0.0 --port 2024"
    volumes:
      - ./langgraph:/app/langgraph
      - langgraph_node_modules:/app/langgraph/node_modules
    environment:
      - LANGGRAPH_ALLOW_BLOCKING=true
    networks:
      - llmgather-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llmgather-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      langgraph-memory:
        condition: service_started
    environment:
      - REDIS_URL=redis://redis:6379
      - MEMORY_PROVIDER=langgraph
      - LANGGRAPH_MEMORY_URL=http://langgraph-memory:2024
    networks:
      - llmgather-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: llmgather-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - llmgather-net

volumes:
  mysql_data:
  redis_data:
  langgraph_node_modules:

networks:
  llmgather-net:
    driver: bridge

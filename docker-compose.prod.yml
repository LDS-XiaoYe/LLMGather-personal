# LLM Gather — 生产环境一键部署
# 启动: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f

services:
  db:
    image: mysql:8.0
    container_name: llmgather-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-llmgather123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-llmgather}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmgather-net

  redis:
    image: redis:7-alpine
    container_name: llmgather-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmgather-net

  langgraph-memory:
    image: node:22-alpine
    container_name: llmgather-langgraph-memory
    restart: unless-stopped
    working_dir: /app/langgraph
    command: sh -c "npm ci --omit=dev && npm run dev"
    volumes:
      - ./langgraph:/app/langgraph
      - langgraph_node_modules:/app/langgraph/node_modules
    environment:
      - LANGGRAPH_ALLOW_BLOCKING=true
    networks:
      - llmgather-net

  qdrant:
    image: qdrant/qdrant:v1.15.5@sha256:0fb8897412abc81d1c0430a899b9a81eb8328aa634e7242d1bc804c1fe8fe863
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r line <&3; [[ \"$$line\" == *200* ]]"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - llmgather-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llmgather-backend
    restart: unless-stopped
    env_file:
      - ${LLMGATHER_ENV_FILE:-.env.docker}
    depends_on:
      qdrant:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      langgraph-memory:
        condition: service_started
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - MEMORY_PROVIDER=langgraph
      - LANGGRAPH_MEMORY_URL=http://langgraph-memory:2024
    networks:
      - llmgather-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: llmgather-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - llmgather-net

volumes:
  qdrant_data:
  mysql_data:
  redis_data:
  langgraph_node_modules:

networks:
  llmgather-net:
    driver: bridge

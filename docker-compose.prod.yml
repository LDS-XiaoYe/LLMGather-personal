# LLM Gather — 生产环境一键部署
# 启动: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f

services:
  db:
    image: mysql:8.0
    container_name: llmgather-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-llmgather123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-llmgather}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmgather-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llmgather-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    networks:
      - llmgather-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: llmgather-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - llmgather-net

volumes:
  mysql_data:

networks:
  llmgather-net:
    driver: bridge
